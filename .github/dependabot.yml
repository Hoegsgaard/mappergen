version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Compiler analysis supports the 6.0 API. New minor versions need an explicit migration.
      - dependency-name: '@typescript/typescript6'
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Typings track the minimum supported Node line, not the newest. A major bump would
      # let code compile against APIs that are missing on Node 22.12.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
