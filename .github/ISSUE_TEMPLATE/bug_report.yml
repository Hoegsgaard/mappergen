name: Bug report
description: Report a reproducible problem with MapperGen.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the mapper, source/target types and relevant configuration, or link a small reproduction. Remove secrets and application data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include MapperGen, Node.js, TypeScript and Vite/Vitest versions, and your operating system.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Paste the complete relevant error, if any.
      render: text
